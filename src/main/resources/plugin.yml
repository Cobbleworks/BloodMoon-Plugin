name: BloodMoon-Event
version: ${project.version}
main: com.cobbleworks.bloodmoon.BloodMoonPlugin
api-version: '26.2'
author: Cobbleworks
website: https://github.com/Cobbleworks/BloodMoon-Plugin
depend:
  - Blockfolk
commands:
  bloodmoon:
    description: Manage the Blood Moon event.
    usage: "/bloodmoon <healthbar|start|stop|status|spawn|clear|reload|enable|disable|chance|difficulty> (spawn: vampire|clown|zombie|witch|scarecrow|ghost|werewolf)"
    aliases:
      - bm
permissions:
  bloodmoon.admin:
    description: Allows full Blood Moon administration.
    default: op
  bloodmoon.healthbar:
    description: Allows players to use the overhead special NPC healthbar system.
    default: true
  bloodmoon.notify:
    description: Allows receiving Blood Moon notifications.
    default: true
